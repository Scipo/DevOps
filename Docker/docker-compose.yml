services:
    web:
        image: rabitor/web1:v1.0
        ports:
            -  8080:80
        depends_on:
          - db  
        deploy:
             replicas: 3
        networks:
          - app-network
    db:
        image:  rabitor/db:latest
        deploy:
            replicas: 1
            placement:
               constraints: [node.role == manager] 
        networks:
            - app-network
        environment:
            MYSQL_ROOT_PASSWORD: "12345"
networks:
   app-network: 
           
            
            
        
        
